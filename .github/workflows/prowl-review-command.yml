# Drive prowl-review from PR comments (@prowl-review <command>) on the always-on,
# self-hosted Mac mini runner using the keyless Codex (ChatGPT subscription)
# provider (#45/#64). The subscription login lives ONLY on the runner (via
# `codex login` into a dedicated CODEX_HOME); it is never a GitHub secret, and no
# PROWL_AI_KEY* is set.
#
# PUBLIC-REPO CAVEATS (prowl-docs is a PUBLIC repo, so these apply):
#   - OpenAI's CI/CD authentication guidance says, verbatim:
#       "Do not use this workflow for public or open-source repositories."
#   - GitHub advises against self-hosted runners on public repositories: any PR
#     can execute code on the runner. The ubuntu `resolve` job (no secrets)
#     computes the fork/trust verdict; the self-hosted `command` job's job-level
#     same-repo `if:` gate is REQUIRED here so a fork PR is never scheduled onto
#     the runner. Codex itself also runs `--sandbox read-only`.
name: prowl-review command

on:
  issue_comment:
    types: [created]

# Adding pull_request_review_comment enables inline questions/ignore replies, but
# every inline review comment then creates a workflow run.

permissions:
  pull-requests: read

jobs:
  resolve:
    # Only honor mentions from a trusted commenter (owner/member/collaborator).
    # This ubuntu job (no provider secrets) resolves the fork/trust verdict so the
    # self-hosted job below is only ever scheduled for a same-repo request.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      contains(github.event.comment.body, '@prowl-review')
    runs-on: ubuntu-latest
    # Serialize command resolution by PR too, so a burst of comments cannot race
    # ahead of the self-hosted command job for the same PR.
    concurrency:
      group: prowl-review-codex-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      trusted_head: ${{ steps.pr.outputs.trusted_head }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ github.event.issue.number }}"
          IFS=$'\t' read -r base_sha head_sha head_repo < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.base.sha, .head.sha, .head.repo.full_name] | @tsv'
          )
          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "head_repo=${head_repo}"
          } >> "$GITHUB_OUTPUT"
          if [ "${head_repo}" = "${GITHUB_REPOSITORY}" ]; then
            echo "trusted_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted_head=false" >> "$GITHUB_OUTPUT"
          fi

  command:
    needs: resolve
    # Same-repo gate: keeps fork PRs off the self-hosted runner. REQUIRED on this
    # public repo (fork code-execution risk).
    if: needs.resolve.outputs.trusted_head == 'true' && needs.resolve.outputs.head_repo == github.repository
    runs-on: [self-hosted, macOS, prowl-review]
    timeout-minutes: 30
    permissions:
      pull-requests: write # post the review + inline comments
      issues: write        # create/update the summary comment
      checks: write        # optional merge-gate check run
      contents: read
    # Shared per-PR Codex group serializes commands with auto reviews of the same
    # PR. Keep this non-cancelling so auto-review pushes do not interrupt commands.
    concurrency:
      group: prowl-review-codex-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      PROWL_APP_CONFIGURED: ${{ secrets.PROWL_APP_ID != '' && secrets.PROWL_APP_PRIVATE_KEY != '' }}
    steps:
      # Branded identity (#59): mint an App installation token when PROWL_APP_ID
      # is set so the command reply posts as prowl-review[bot] with the App
      # avatar. The env flag is only a boolean; the private key is only handed
      # to the token action. Falls back to github-actions[bot].
      - name: Mint prowl-review app token
        id: app-token
        if: env.PROWL_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.PROWL_APP_ID }}
          private-key: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: prowl-base
          persist-credentials: false

      - name: Bootstrap trusted review config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f prowl-base/.prowl-review.yml ]; then
            cat > prowl-base/.prowl-review.yml <<'YAML'
          provider: codex
          model: gpt-5.5
          codex:
            effort: low
          YAML
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: pr-head
          persist-credentials: false

      # Pinned to a reviewed commit containing the codex provider.
      - uses: prowl-tools/prowl-code-review@e7f0431b7daf2cc818a003c5ac216f29e7da3c53
        with:
          mode: command
          # Keyless: no PROWL_AI_KEY* — auth is the runner's own `codex login`.
          ai-provider: codex
          workspace-path: ${{ github.workspace }}/pr-head
          # Read model/effort from the trusted base-branch config, never PR code.
          config-path: ${{ github.workspace }}/prowl-base/.prowl-review.yml
          # guidelines-path: ${{ github.workspace }}/prowl-base
          # Branded App token when configured; otherwise the default Actions token.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          bot-login: ${{ steps.app-token.outputs.app-slug != '' && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
